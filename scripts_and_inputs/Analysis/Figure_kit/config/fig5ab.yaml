# Figure 5a, b only (the computational panels of the paper's Fig. 5); panels c-e are wet-lab and not part of this repository.
# Same geometry as the published Fig. 5: this page is its top 62 mm.
# a, b: the seeded CellOracle rerun in this repository; b shows the 9 assayed DOFs nominated in at least one genotype.
# Tables: tools/fig5ab_tables.py -> data/fig5/. Rebuild: python build.py fig5ab
label: Fig. 5a,b
output_stem: Fig5ab
size_mm: [180, 62]
coloured_text: false      # true = the candidate's coloured labels (WT/fer-4 counts, red bases, tinted model labels);
                          # the journal profile then warns 'coloured text'
letters:                  # panel letter positions: x, top of the letter (mm) = the approved 10-pt letters' tops;
  a: [0.1, 2.774]         # a shares the left-column x of c, d, f, g (approved page: 0.3)
  b: [81.0, 2.774]

# Deliberate deviations from the journal profile, each with its reason (shown in output/REPORT.md).
accepted: []

panels:
  a:
    type: forest
    table: data/fig5/fig5a_TF_family_enrichment_all_tests.csv   # = CellOracle_GRN_analysis/outputs/TF_family_enrichment/TF_family_enrichment_all_tests.csv
    data_status: upstream_table
    box: [0, 1.0, 79, 60]                 # approved: draw_enrichment_a.py panel (79 x 60 mm) at (0, 1.0)
    rule: {min_eligible: 10, n_families: 10, order_by: fer-4, q_cut: 0.05}
    genotypes:                          # top to bottom within each row
      - {name: WT, label: WT, colour: '#2b6cb0'}
      - {name: fer-4, label: '*fer-4*', colour: '#dd6b20'}
    family_labels: {Dof: DOF, MIKC_MADS: MIKC MADS}
    bold_families: [Dof]
    header_names: TF family
    header_counts: Nominated / eligible
    axis_title: Odds ratio (95% CI)
    key: [["q < 0.05", true], ["q \u2265 0.05", false]]
    or_range: [0.15, 20]
    ticks: [0.25, 1, 4, 16]
    zero_arrow_to: 0.17                 # OR = 0: arrow from the upper CI towards zero, tip here
    text_pt: 7.0                        # names, headers, axis title (approved sizes)
    small_pt: 6.5                       # counts, tick labels, key
    x_name: 17.0
    x_axis: [19.6, 48.6]
    x_counts: [57.6, 71.2]
    band_x: [1.6, 78.0]
    band_colour: '#f2f2f2'
    key_x: [51.8, 65.8]                 # key markers; text key_text_gap to the right
    key_text_gap: 1.4
    key_colour: '#333333'
    y_head: 4.4
    y_sub: 7.75
    y_row0: 11.0
    pitch: 4.0
    offset: 0.9
    y_axis: 51.0
    y_tick: 54.6                        # tick-label baseline
    y_title: 58.4
    point_d: 1.44
    point_edge_pt: 0.6
    ci_lw_pt: 0.75
    arrow_shaft_gap: 0.9
    ref_lw_pt: 0.6
    ref_colour: '#8c8c8c'
    ref_dashes: [3, 2]
    axis_pt: 0.5
    tick_pt: 0.5
    tick_len: 0.8
    axis_colour: '#333333'
  b:
    type: network
    edges: data/fig5/fig5b_network_edges.csv                # RERUN network (9 nominated LUC-tested DOFs; CDF4 dropped)
    dof_nodes: data/fig5/fig5b_network_dof_nodes.csv
    target_nodes: data/fig5/fig5b_network_target_nodes.csv
    layout: data/fig5/fig5b_network_layout.csv             # = the kit automatic layout (tools/fig5ab_tables.py)
    data_status: upstream_table
    box: [82.0, 0, 98, 61]              # approved: the R panel (98 x 61 mm, compact_panels.R) with its origin at x 82.0
    header_dofs: DOFs
    header_targets: Predicted DOF targets
    header_targets_x: 72.925            # centre of the target header (approved)
    highlight_target: YUC5
    group_order: [WT only, fer-4 only, Both]
    group_labels: {WT only: WT only, fer-4 only: '*fer-4* only', Both: Both}
    class_order: [YUC/TAA, GH3, Aux/IAA, SAUR]
    class_labels: {YUC/TAA: YUC/TAA1, GH3: GH3, Aux/IAA: Aux/IAA, SAUR: SAUR}
    class_colours: {YUC/TAA: '#E69F00', GH3: '#CC79A7', Aux/IAA: '#0072B2', SAUR: '#009E73'}
    dof_colour: '#595959'
    node_d_per_sqrt: 0.68               # DOF node diameter (mm) = 0.68 x sqrt(displayed targets): area ~ targets
    target_d: 1.49
    target_edge_pt: 0.28
    header_pt: 6.83                     # approved R sizes (geom_text mm x 72.27/25.4); YUC5 7.11 -> 7 (journal max)
    header_targets_pt: 7.0
    dof_label_pt: 6.69
    target_label_pt: 6.54
    highlight_label_pt: 7.0
    group_label_pt: 6.26
    class_label_pt: 6.26
    node_label_pt: 6.54
    edge:
      other: {lw_pt: 0.3, colour: '#adadad', alpha: 0.63}
      highlight: {lw_pt: 0.66, colour: '#333333'}
    group_bracket_pt: 0.53
    group_bracket_colour: '#b3b3b3'
    class_bracket_pt: 0.85
    bracket_pad: 1.0
    x: {group_label: 13.5, group_bracket: 14.7, dof_label: 28.8, dof_node: 31.0, target_node: 66.0,
        target_label: 68.2, class_bracket: 82.5, class_label: 84.1}
    y_head: 5.36
    y_first: 9.5                        # layout-table y 0 (CDF4, YUC5); scale 1 mm per layout mm as approved
    y_last: 57.5
    auto_layout: {target_pitch: 3.0, class_gap: 2.0, group_gap: 3.0}
