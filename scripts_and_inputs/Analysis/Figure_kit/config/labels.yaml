# How data names are printed (markup: *italic*, **bold**). Data tables keep the plain names on the left.
# One place for every figure, so a genotype is spelled and italicised the same way everywhere.
# Genotype names are fully italic, including FER/ and the line suffix _L1, as in the image labels
# (Trevor, 7 Oct 2026).
genotypes:
  Col-0: "Col-0"
  fer-4: "*fer-4*"
  FER/fer-4: "*FER/fer-4*"
  pWER-KO: "*pWER-KO*"
  pCO2-KO: "*pCO2-KO*"
  pSCR-KO: "*pSCR-KO*"
  pSHR-KO: "*pSHR-KO*"
  pSMB-KO: "*pSMB-KO*"
