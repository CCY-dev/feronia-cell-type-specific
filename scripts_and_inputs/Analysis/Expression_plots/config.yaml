# FER single-cell expression figures: Extended Data Fig. 7d,e (YUC5) and Supplementary Figs 1-2 (the ten assayed DOFs).
# Every number is drawn from data/ (per-cell export made read-only from the integrated Seurat v3 object by
# tools/hpc/extract_si_expression.R; DE and nomination tables derived by tools/derive_de_tables.py); every word is here.
# Rebuild everything:  python build.py
cells: data/si_expression_cells.csv.gz
celltype_palette: data/fig1a_palette.csv       # Fig. 1a cell-type colours (kit v3.2), only for the optional reference map
samples: {sc_291: WT, sc_293: WT, sc_292: fer4, sc_294: fer4}
genotype_order: [WT, fer4]                      # left/right and upper/lower order everywhere

genes:                                          # symbol -> AGI, column in the export, printed label (italic)
  YUC5:   {agi: AT5G43890, column: YUC5_AT5G43890}
  DOF4.6: {agi: AT4G24060, column: DOF4.6_AT4G24060}
  CDF4:   {agi: AT2G34140, column: CDF4_AT2G34140}
  COG1:   {agi: AT1G29160, column: COG1_AT1G29160}
  OBP3:   {agi: AT3G55370, column: OBP3_AT3G55370}
  DOF6:   {agi: AT3G45610, column: DOF6_AT3G45610, label: DOF6}      # deck title: 'DOF3.2/6'; text uses DOF6
  DOF4.1: {agi: AT4G00940, column: DOF4.1_AT4G00940}
  DOF2.2: {agi: AT2G28810, column: DOF2.2_AT2G28810}
  DAG1:   {agi: AT3G61850, column: DAG1_AT3G61850}
  OBP1:   {agi: AT3G50410, column: OBP1_AT3G50410}
  OBP2:   {agi: AT1G07640, column: OBP2_AT1G07640}

row_order:                                      # clusters (time.celltype.anno.Li) ordered by cell type, then stage
  celltypes: [Quiescent Center, Columella, Lateral Root Cap, Atrichoblast, Trichoblast, Cortex, Endodermis,
              Metaphloem & Companion Cell, Protophloem, Procambium, Xylem Pole Pericycle, Phloem Pole Pericycle,
              Protoxylem, Metaxylem]        # = Fig. 1a key order (kit fig1a_palette.csv levels)
  stages: [Proliferation Domain, Transition Domain, Elongation, Maturation, Proximal Columella, Distal Columella,
           Proximal Lateral Root Cap, Distal Lateral Root Cap]

names:
  genotypes: {WT: WT, fer4: "*fer-4*"}
  celltypes:
    Quiescent Center: Quiescent center
    Columella: Columella
    Lateral Root Cap: Lateral root cap
    Atrichoblast: Atrichoblast
    Trichoblast: Trichoblast
    Cortex: Cortex
    Endodermis: Endodermis
    Metaphloem & Companion Cell: Metaphloem & companion cell
    Protophloem: Protophloem
    Procambium: Procambium
    Xylem Pole Pericycle: Xylem pole pericycle
    Phloem Pole Pericycle: Phloem pole pericycle
    Protoxylem: Protoxylem
    Metaxylem: Metaxylem
  celltype_lines:                               # wrapped labels (spanning their stage rows)
    Quiescent Center: [Quiescent center]
    Lateral Root Cap: [Lateral root, cap]
    Metaphloem & Companion Cell: [Metaphloem &, companion cell]
    Xylem Pole Pericycle: [Xylem pole, pericycle]
    Phloem Pole Pericycle: [Phloem pole, pericycle]
  stages:
    Proliferation Domain: Proliferation
    Transition Domain: Transition
    Elongation: Elongation
    Maturation: Maturation
    Proximal Columella: Proximal
    Distal Columella: Distal
    Proximal Lateral Root Cap: Proximal
    Distal Lateral Root Cap: Distal
  stages_short:            # rotated stage labels in the ED7e strip
    Proliferation Domain: Proliferation
    Transition Domain: Transition
    Elongation: Elongation
    Maturation: Maturation
    Proximal Columella: Proximal
    Distal Columella: Distal
    Proximal Lateral Root Cap: Proximal
    Distal Lateral Root Cap: Distal

de_table: data/de_dof_yuc5.csv               # muscat rows for the ten DOFs and YUC5 (see data/de_dof_yuc5.README.txt)
nomination_table: data/dof_nominations.csv   # CellOracle nominations of the ten DOFs (see data/dof_nominations.README.txt)

clusters:                # which cell-type x stage clusters are drawn
  de_eligible_only: true # only clusters eligible for differential expression (muscat pbDS min_cells = 5: every one of the
                         # four samples has >= 5 cells in the cluster); all 46 stay in the source data with a flag
  min_cells_per_sample: 5
  de_tested_list: data/de_tested_clusters.txt   # cross-check: the rule must give exactly the clusters tested in sig_de

style:
  font: [Arial, Helvetica, DejaVu Sans]
  label_pt: 6.0          # cell-type labels, axis titles
  small_pt: 5.5          # stage labels, cell counts, ticks, keys
  header_pt: 7.0         # gene and genotype headers (Fig. 1a headers are 7 pt)
  letter_pt: 8.0
  expression_colours: [lightgrey, blue]        # Seurat FeaturePlot defaults, as Fig. 1a (CIE-LAB interpolation)
  umap:
    pad_frac: 0.02       # Fig. 1a frame rule
    ppi: 600
    point_size_pt2: 0.42 # Fig. 1a value at 28-mm maps; scaled by (map width / 28 mm)^2
    order: value         # 'value' = expressing cells drawn on top (FeaturePlot order = TRUE); 'object' = Fig. 1a
    map_w: 28.0
    gap_x: 3.0
    gap_y: 1.8
    key_w: 1.6
    key_h: 12.0
    key_h_w: 12.0        # horizontal key length (option B)
    key_gap: 1.6
    key_step: null       # tick step of the expression keys (null: 1, or 0.5 when the range is < 2)
    row_label_dx: 2.4
  rows:
    row_pitch: 2.3
    group_gap: 0.45
    celltype_w: 20.5
    stage_w: 13.0
    count_w: 7.0
    count_title_dy: 2.4
    chart_gap: 1.8
    pad: 0.6
    band_grey: 0.935
    header_h: 10.0
    show_counts: true
  dot:
    dot_pitch: 3.0
    gene_gap: 2.6
    dot_max_d: 2.3       # diameter at 100 % expressing cells (area proportional to the percentage)
    dot_edge_grey: 0.5
    dot_edge_pt: 0.2
    mean: arithmetic     # dot colour: 'arithmetic' = mean of the SCT values (zeros included); 'seurat_dotplot' =
                         # Seurat DotPlot's unscaled average, log1p(mean(expm1(x))). Both are in the source data.
    mean_max: null       # colour scale maximum for mean expression (null: the largest cluster mean of all 11 genes)
    mean_step: 0.5
    size_key: [10, 25, 50, 100]
    colour_key_w: 14.0
    gene_dy: 6.4
  dot_by_genotype:       # option A grouped by genotype (layouts si_dot_geno, ed7_dot_geno)
    dot_pitch: 3.2
    count_w: 6.6           # cell-count column inside each genotype block
    count_gap: 0.8
    block_gap: 3.2         # white gap between the WT and fer-4 blocks (row bands break here)
    col_label_h: 9.6       # room for the rotated gene labels above the first row
    geno_dy: 1.2           # genotype header baseline above its rule
    rule_pt: 0.4
    gene_label_pt: 6.5
    show_counts: false     # cells per cluster: in the source data, not on the figure
  violin:
    col_w: 19.0
    col_gap: 2.6
    half_frac: 0.47      # half-violin height as a fraction of the row pitch
    edge_pt: 0.3
    flat_pt: 0.4
    axis_pt: 0.5
    tick_len: 0.8
    axis_gap: 0.6
    axis_title_dy: 2.8
    tick_step: null
    zero_line_grey: null
    axis_title: "Expression (SCT-normalised)"
    fill: {WT: [255, 255, 255], fer4: [40, 40, 40]}     # kit genotype_fill Col-0 / fer-4 (config/style.yaml)
    edge: {WT: [90, 90, 90], fer4: [40, 40, 40]}        # kit genotype_stroke

figures:                                        # the four panels/figures used in the manuscript (20 Oct 2026)
  - {id: ED7d_YUC5_UMAP, layout: ed7_d_slot, title: "Extended Data Fig. 7d", genes: [YUC5],
     width_mm: 92.5, height_mm: 50.0, top: 0.0, d_x: 7.5, umap: {map_w: 34.0, gap_x: 2.5}}
  - {id: ED7e_YUC5_dotplot, layout: ed7_e_strip, title: "Extended Data Fig. 7e", genes: [YUC5],
     width_mm: 180, height_mm: 42.0, top: 0.0,
     strip: {x_dots: 10.0, right_margin: 0.5, group_gap: 0.9, pitch_max: 4.2, label_pt: 5.5, stage_pt: 5.5,
             label_pad: 0.6, ct_top: 3.0, bracket_dy: 1.0, stage_dy: 0.7, dots_dy: 2.3, row_pitch: 3.6,
             dot_max_d: 2.6, row_label_gap: 1.2, key_dy: 3.4, size_key_dx: 44.0, gene_pt: 6.0, block_gap: 0, geno_label_dx: 0,
             celltype_lines: {Protophloem: [Proto-, phloem], Metaxylem: [Meta-, xylem],
                              Phloem Pole Pericycle: [Phloem, pole peri-, cycle]}}}
  - {id: SupplFig1_DOF_expression, layout: si_dof_strip, title: "Supplementary Fig. 1",
     genes: [DOF4.6, CDF4, COG1, OBP3, DOF6, DOF4.1, DOF2.2, DAG1, OBP1, OBP2],
     width_mm: 180, height_mm: 247, top: 0.0, x_left: 13.0, right_margin: 0.5, b_gap: 2.6, key_dy: 0.9, key_frac: 0.82,
     key_title: [Expression, (SCT)], geno_label_gap: 1.2, glyph_x: 3.4, glyph_up: 2.8, glyph_L: 3.2, geno_label_frac: 0.38,
     umap: {gap_x: 1.3, gap_y: 1.0},
     strip: {group_gap: 0.9, pitch_max: 4.2, label_pt: 5.5, stage_pt: 5.5, label_pad: 0.6, ct_top: 3.0,
             bracket_dy: 1.0, stage_dy: 0.7, dots_dy: 2.2, row_pitch: 3.15, dot_max_d: 2.6, row_label_gap: 1.2,
             gene_pt: 6.0, block_gap: 2.4, geno_label_dx: 10.4, key_dy: 3.4, size_key_dx: 44.0,
             celltype_lines: {Protophloem: [Proto-, phloem], Metaxylem: [Meta-, xylem],
                              Phloem Pole Pericycle: [Phloem, pole peri-, cycle]}}}
  - {id: SupplFig2_DOF_DE_and_network, layout: si_de_and_nominations, title: "Supplementary Fig. 2",
     genes: [DOF4.6, CDF4, COG1, OBP3, DOF6, DOF4.1, DOF2.2, DAG1, OBP1, OBP2], extra_genes: [YUC5], d_gap: 2.0, nominations: {top_pad: 1.0, mark_d: 1.7, colours: {WT: '#2b6cb0', fer-4: '#dd6b20'}},
     width_mm: 180, height_mm: 170, top: 0.0, x_left: 13.0, right_margin: 0.5,
     heatmap: {row_pitch: 3.4, cell_gap: 0.25, lim: 2.0, down: "#1b7837", up: "#762a83", ns_grey: 0.86,
               value_pt: 5.0, gene_pt: 6.0, count_w: 0.0, extra_gap: 1.8, key_dy: 5.0, key_w: 16.0},
     strip: {group_gap: 0.9, pitch_max: 4.2, label_pt: 5.5, stage_pt: 5.5, label_pad: 0.6, ct_top: 3.0,
             bracket_dy: 1.0, stage_dy: 0.7, dots_dy: 2.2, row_pitch: 3.15, dot_max_d: 2.6, row_label_gap: 1.2,
             gene_pt: 6.0, block_gap: 2.4, geno_label_dx: 10.4, key_dy: 3.4, size_key_dx: 44.0,
             celltype_lines: {Protophloem: [Proto-, phloem], Metaxylem: [Meta-, xylem],
                              Phloem Pole Pericycle: [Phloem, pole peri-, cycle]}}}

compare:                                        # optional before/after pages; skipped when the deck PDF is absent
  deck: ../../../../Original_full_figures.pdf
  pages:
    - {before_page: 20, label: "Extended Data Fig. 7 (deck; d and e are redrawn)", after: [ED7d_YUC5_UMAP, ED7e_YUC5_dotplot]}
    - {before_page: 31, label: "Supplementary Fig. 1 (deck)", after: [SupplFig1_DOF_expression]}
    - {before_page: 32, label: "Supplementary Fig. 2 (deck)", after: [SupplFig2_DOF_DE_and_network]}
